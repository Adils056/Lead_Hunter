; Supervisor config (Linux production). Copy to /etc/supervisor/conf.d/ then: supervisorctl reread && supervisorctl update
[program:leadpilot-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/leadpilot/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=1800
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/leadpilot/storage/logs/worker.log
stopwaitsecs=1800
; Scheduler: add to crontab -e for www-data:
; * * * * * cd /var/www/leadpilot && php artisan schedule:run >> /dev/null 2>&1
