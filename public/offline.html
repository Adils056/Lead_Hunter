<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Offline — LeadPilot AI</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  main { max-width: 360px; text-align: center; display: grid; gap: 14px; }
  img { width: 72px; height: 72px; border-radius: 16px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: #94a3b8; line-height: 1.5; }
  button { margin-top: 6px; padding: 10px 18px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>LeadPilot needs a connection to show your leads. Your data is safe on the server.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
